events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Upstream Definitions
    upstream auth_service {
        server auth-service:8000;
    }

    upstream topology_service {
        server topology-service:8001;
    }

    upstream mission_service {
        server mission-service:8002;
    }

    upstream observation_service {
        server observation-service:8003;
    }

    upstream reconciliation_service {
        server reconciliation-service:8004;
    }

    upstream alerting_service {
        server alerting-service:8005;
    }

    upstream digital_twin_sync {
        server digital-twin-sync:8006;
    }

    server {
        listen 8080;
        server_name localhost;

        # Global CORS Headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ── Auth & Admin API ──
        location /api/v1/auth {
            proxy_pass http://auth_service/api/v1/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/admin {
            proxy_pass http://auth_service/api/v1/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Topology, Products & Robots API ──
        location /api/v1/products {
            proxy_pass http://topology_service/api/v1/products;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/warehouses {
            proxy_pass http://topology_service/api/v1/warehouses;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/zones {
            proxy_pass http://topology_service/api/v1/zones;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/robots {
            proxy_pass http://topology_service/api/v1/robots;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Mission Control API ──
        location /api/v1/missions {
            proxy_pass http://mission_service/api/v1/missions;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Observation Ingestion API ──
        location /api/v1/observations {
            proxy_pass http://observation_service/api/v1/observations;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Inventory & Reconciliation API ──
        location /api/v1/inventory {
            proxy_pass http://reconciliation_service/api/v1/inventory;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/reconciliation {
            proxy_pass http://reconciliation_service/api/v1/reconciliation;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Alerts API ──
        location /api/v1/alerts {
            proxy_pass http://alerting_service/api/v1/alerts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── WebSocket Digital Twin Telemetry Stream ──
        location /ws/telemetry {
            proxy_pass http://digital_twin_sync/ws/telemetry;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
    }
}
