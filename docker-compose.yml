networks:
  warehouse-net:
    driver: bridge
volumes:
  postgres_data: null
  redis_data: null
  minio_data: null
  prometheus_data: null
  grafana_data: null
services:
  postgres:
    image: postgres:16-alpine
    container_name: wh-postgres
    environment:
      POSTGRES_USER: warehouse_admin
      POSTGRES_PASSWORD: warehouse_secret
      POSTGRES_DB: warehouse_platform
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U warehouse_admin -d warehouse_platform
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - warehouse-net
  redis:
    image: redis:7-alpine
    container_name: wh-redis
    command: redis-server --requirepass redis_secret --maxmemory 512mb --maxmemory-policy
      allkeys-lru
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - redis_secret
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - warehouse-net
  minio:
    image: minio/minio:latest
    container_name: wh-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret
    ports:
    - 9000:9000
    - 9001:9001
    volumes:
    - minio_data:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
    - warehouse-net
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: wh-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://warehouse_admin:warehouse_secret@postgres:5432/warehouse_platform
      REDIS_URL: redis://:redis_secret@redis:6379/0
      SERVICE_NAME: auth-service
      LOG_LEVEL: INFO
      PORT: 8000
      SECRET_KEY: super-secret-key-for-wareops-auth-service-jwt-tokens-12345
      FRONTEND_URL: http://localhost:5173
    ports:
    - 8000:8000
    networks:
    - warehouse-net
    restart: unless-stopped
  topology-service:
    build:
      context: ./services/topology-service
      dockerfile: Dockerfile
    container_name: wh-topology-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://warehouse_admin:warehouse_secret@postgres:5432/warehouse_platform
      REDIS_URL: redis://:redis_secret@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
      SERVICE_NAME: topology-service
      LOG_LEVEL: INFO
      PORT: 8001
    ports:
    - 8001:8001
    networks:
    - warehouse-net
    restart: unless-stopped
  mission-service:
    build:
      context: ./services/mission-service
      dockerfile: Dockerfile
    container_name: wh-mission-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://warehouse_admin:warehouse_secret@postgres:5432/warehouse_platform
      REDIS_URL: redis://:redis_secret@redis:6379/1
      TOPOLOGY_SERVICE_URL: http://topology-service:8001
      KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
      SERVICE_NAME: mission-service
      LOG_LEVEL: INFO
      PORT: 8002
    ports:
    - 8002:8002
    networks:
    - warehouse-net
    restart: unless-stopped
  observation-service:
    build:
      context: ./services/observation-service
      dockerfile: Dockerfile
    container_name: wh-observation-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://warehouse_admin:warehouse_secret@postgres:5432/warehouse_platform
      REDIS_URL: redis://:redis_secret@redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_secret
      MINIO_BUCKET: warehouse-frames
      TOPOLOGY_SERVICE_URL: http://topology-service:8001
      ALERTING_SERVICE_URL: http://alerting-service:8005
      SERVICE_NAME: observation-service
      LOG_LEVEL: INFO
      PORT: 8003
    ports:
    - 8003:8003
    networks:
    - warehouse-net
    restart: unless-stopped
  reconciliation-service:
    build:
      context: ./services/reconciliation-service
      dockerfile: Dockerfile
    container_name: wh-reconciliation-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://warehouse_admin:warehouse_secret@postgres:5432/warehouse_platform
      REDIS_URL: redis://:redis_secret@redis:6379/3
      TOPOLOGY_SERVICE_URL: http://topology-service:8001
      SERVICE_NAME: reconciliation-service
      LOG_LEVEL: INFO
      PORT: 8004
    ports:
    - 8004:8004
    networks:
    - warehouse-net
    restart: unless-stopped
  alerting-service:
    build:
      context: ./services/alerting-service
      dockerfile: Dockerfile
    container_name: wh-alerting-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://warehouse_admin:warehouse_secret@postgres:5432/warehouse_platform
      REDIS_URL: redis://:redis_secret@redis:6379/4
      SERVICE_NAME: alerting-service
      LOG_LEVEL: INFO
      PORT: 8005
    ports:
    - 8005:8005
    networks:
    - warehouse-net
    restart: unless-stopped
  digital-twin-sync:
    build:
      context: ./services/digital-twin-sync
      dockerfile: Dockerfile
    container_name: wh-digital-twin-sync
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://:redis_secret@redis:6379/5
      TOPOLOGY_SERVICE_URL: http://topology-service:8001
      SERVICE_NAME: digital-twin-sync
      LOG_LEVEL: INFO
      PORT: 8006
    ports:
    - 8006:8006
    networks:
    - warehouse-net
    restart: unless-stopped
  api-gateway:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile.local
    container_name: wh-api-gateway
    depends_on:
    - auth-service
    - topology-service
    - mission-service
    - observation-service
    - reconciliation-service
    - alerting-service
    - digital-twin-sync
    ports:
    - 8080:8080
    volumes:
    # Mount pre-built SPA (build it first: cd apps/ops-dashboard && npm run build)
    - ./apps/ops-dashboard/dist:/usr/share/nginx/html:ro
    environment:
      PORT: "8080"
      AUTH_SERVICE_HOST: "auth-service:8000"
      TOPOLOGY_SERVICE_HOST: "topology-service:8001"
      MISSION_SERVICE_HOST: "mission-service:8002"
      OBSERVATION_SERVICE_HOST: "observation-service:8003"
      RECONCILIATION_SERVICE_HOST: "reconciliation-service:8004"
      ALERTING_SERVICE_HOST: "alerting-service:8005"
      TWIN_SERVICE_HOST: "digital-twin-sync:8006"
    networks:
    - warehouse-net
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: wh-prometheus
    ports:
    - 9090:9090
    volumes:
    - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    - prometheus_data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.console.libraries=/etc/prometheus/console_libraries
    - --web.console.templates=/etc/prometheus/consoles
    - --storage.tsdb.retention.time=15d
    - --web.enable-lifecycle
    networks:
    - warehouse-net
  grafana:
    image: grafana/grafana:10.4.2
    container_name: wh-grafana
    ports:
    - 3001:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafana_secret
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
    - grafana_data:/var/lib/grafana
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
    - prometheus
    networks:
    - warehouse-net
  robot-simulator:
    build:
      context: ./apps/robot-simulator
      dockerfile: Dockerfile
    container_name: wh-robot-simulator
    depends_on:
    - observation-service
    - mission-service
    environment:
      OBSERVATION_SERVICE_URL: http://observation-service:8003
      MISSION_SERVICE_URL: http://mission-service:8002
      TOPOLOGY_SERVICE_URL: http://topology-service:8001
      ROBOT_COUNT: 3
      WAREHOUSE_ID: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      LOG_LEVEL: INFO
    networks:
    - warehouse-net
    restart: unless-stopped
