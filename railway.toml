# ── Robot Simulator (background worker, no public port) ───────────────────────
[services.robot-simulator]
[services.robot-simulator.build]
dockerfilePath = "apps/robot-simulator/Dockerfile"
buildContext   = "apps/robot-simulator"
[services.robot-simulator.deploy]
# No healthcheck path — simulator is a worker, not a server
restartPolicyType       = "ON_FAILURE"
restartPolicyMaxRetries = 10
