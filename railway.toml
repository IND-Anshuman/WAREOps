# ─────────────────────────────────────────────────────────────────────────────
# WAREOps — Railway Monorepo Configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# Architecture on Railway:
#
#   PUBLIC  → api-gateway  (nginx + React SPA, port exposed via Railway domain)
#   INTERNAL → all 7 FastAPI services (no public port, internal Railway DNS)
#   INTERNAL → robot-simulator (always-on worker, no port)
#
# Each service below maps to a Railway service of the same name.
# Railway resolves internal hostnames as:
#   <service-name>.railway.internal
#
# ENV VARS shared across services are set as Railway "shared variables" in
# the dashboard. Service-specific vars override them per service.
# ─────────────────────────────────────────────────────────────────────────────

# ── API Gateway (public-facing: nginx + React SPA) ───────────────────────────
[services.api-gateway]
[services.api-gateway.build]
dockerfilePath    = "infrastructure/nginx/Dockerfile"
# Build context must be repo root so the Dockerfile can COPY apps/ops-dashboard/
buildContext      = "."
buildArgs         = { VITE_API_BASE_URL = "/api/v1", VITE_TOPOLOGY_API_URL = "/api/v1", VITE_WS_URL = "" }

[services.api-gateway.deploy]
healthcheckPath     = "/health"
healthcheckTimeout  = 300
restartPolicyType   = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas         = 1

# ── Auth Service ──────────────────────────────────────────────────────────────
[services.auth-service]
[services.auth-service.build]
dockerfilePath = "services/auth-service/Dockerfile"
buildContext   = "services/auth-service"
[services.auth-service.deploy]
healthcheckPath    = "/health"
healthcheckTimeout = 120
restartPolicyType  = "ON_FAILURE"

